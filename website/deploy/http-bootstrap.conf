server {
    listen 80;
    listen [::]:80;
    server_name www.maxdevlab.com;
    root /home/www/websites/www.maxdevlab.com/current;
    index index.html;
    access_log /var/log/nginx/www.maxdevlab.com_access.log;
    error_log /var/log/nginx/www.maxdevlab.com_error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /home/www/websites/www.maxdevlab.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
