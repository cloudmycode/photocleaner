server {
    listen 80;
    listen [::]:80;
    server_name www.maxdevlab.com;
    access_log /var/log/nginx/www.maxdevlab.com_access.log;
    error_log /var/log/nginx/www.maxdevlab.com_error.log warn;
    location ^~ /.well-known/acme-challenge/ {
        root /home/www/websites/www.maxdevlab.com/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://www.maxdevlab.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.maxdevlab.com;
    root /home/www/websites/www.maxdevlab.com/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/www.maxdevlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.maxdevlab.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MaxDevLabSSL:1m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/www.maxdevlab.com_access.log;
    error_log /var/log/nginx/www.maxdevlab.com_error.log warn;
    server_tokens off;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' mailto:" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { deny all; }
    location ~* \.(php|phtml|phar)$ { return 404; }
    location = /_headers { return 404; }
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
}
