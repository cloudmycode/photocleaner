-photo img{width:100%;height:100%;object-fit:cover}.next-photo.original img{object-fit:contain}.target{visibility:hidden;position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;color:#ffffff;background:#0a84ff;font-size:24px;font-weight:550}.target svg{width:44px;height:44px}.target.remove{background:#ffc4bf;color:#7a221b}.direction{position:absolute;z-index:4;left:50%;transform:translateX(-50%);height:36px;display:flex;align-items:center;gap:6px;border:1px solid #ffffff26;background:#1c1c1e80;backdrop-filter:blur(14px);border-radius:24px;padding:0 15px;font-size:12px;font-weight:550;color:white;box-shadow:0 2px 10px #0001}.direction svg{width:15px;height:15px}.up{top:15px}.down{bottom:15px}.up:hover{background:#0a84ff;color:#ffffff}.down:hover{background:#ffb4ae;color:#7a221b}.stamp{position:absolute;inset:0;z-index:3;pointer-events:none;display:grid;place-content:center;opacity:0}.stamp span{padding:15px 20px;border:1px solid #ffffff85;border-radius:20px;background:#007affd9;color:white;font-size:22px;backdrop-filter:blur(15px)}.stamp.remove span{background:#d92d23d9}.photo-meta{position:absolute;left:15px;bottom:19px;z-index:4;font-size:10px;color:#ffffffb8;pointer-events:none}.fit{position:absolute;right:7px;top:10px;z-index:4;color:white;background:#1c1c1e66;backdrop-filter:blur(10px);width:38px;height:38px}.review-footer{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;flex:none}.review-footer .round{background:#ffffff0a}.queue{display:flex;align-items:center;gap:8px;border-radius:25px;height:44px;padding:0 15px;background:#ffffff0a;font-size:12px}.queue b{font-weight:500;color:#ffc4bf}.footer-hint{color:#98989d;font-size:10px;letter-spacing:.2px}.collection{padding:2px 12px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tile{position:relative;aspect-ratio:.8;overflow:hidden;border-radius:9px;padding:0}.tile img{width:100%;height:100%;object-fit:cover}.tile .tick{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;border:1.5px solid #fff;background:#ffffff40;display:grid;place-items:center;color:#fff}.tile.selected .tick{background:#007aff}.tick svg{width:13px;height:13px}.collection-header{padding:5px 22px 22px;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#8e8e93}.text-btn{font-size:12px;padding:10px;color:#007aff}.bottom-actions{display:flex;gap:10px;padding:15px 17px 20px}.solid{background:#007aff;color:white;padding:15px 20px;border-radius:17px;font-size:13px;font-weight:550;min-height:48px}.solid.danger{background:#ff3b30}.secondary{background:#e5e5ea;color:#007aff}.bottom-actions button{flex:1}.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:25px;text-align:center}.empty .orb{width:72px;height:72px;border-radius:50%;background:#e5e5ea;color:#007aff;display:grid;place-items:center}.orb svg{width:30px;height:30px}.empty h2{font-size:25px;font-weight:500;letter-spacing:-.7px}.empty p{font-size:12px;color:#8e8e93;line-height:1.6}.empty .solid{margin-top:10px}.finish-image{width:140px;height:180px;border-radius:15px;object-fit:cover;transform:rotate(-6deg);box-shadow:9px 9px 0 #e5e5ea;margin-bottom:15px}.settings{padding:12px 16px}.setting{background:#fff;padding:20px 16px!important}.setting:first-child{border-radius:12px 12px 0 0}.setting:nth-last-child(2){border-radius:0 0 12px 12px;border-bottom:0}.setting span>svg{color:#007aff}.setting>svg{color:#c7c7cc}.bar>.round{color:#007aff}.dark .bar>.round{color:#0a84ff}.setting{display:flex;align-items:center;justify-content:space-between;width:100%;padding:20px 0;border-bottom:1px solid #3c3c4320;font-size:14px}.setting svg{width:19px}.setting span{display:flex;gap:13px;align-items:center}.setting small{color:#8e8e93;font-size:11px}.demo{font-size:10px;text-align:center;color:#aeaeb2;margin-top:25px}.overlay{position:absolute;inset:0;z-index:20;background:#00000066;display:flex;align-items:end;backdrop-filter:blur(5px)}.sheet{background:#ffffff;color:#1c1c1e;width:100%;padding:12px 24px 28px;border-radius:27px 27px 0 0;box-shadow:0 -15px 50px #0002}.handle{height:4px;width:32px;border-radius:4px;background:#d1d1d6;margin:0 auto 23px}.sheet h2{font-size:24px;font-weight:550;letter-spacing:-.7px;margin-bottom:12px}.sheet p{font-size:13px;line-height:1.6;color:#8e8e93;margin-bottom:22px}.sheet .solid{width:100%;margin-top:8px}.preview{position:absolute;inset:0;z-index:20;background:#000000;display:flex;align-items:center}.preview img{width:100%;height:100%;object-fit:contain}.preview .round{position:absolute;right:15px;top:35px;color:white;background:#ffffff16}.toast{position:absolute;bottom:86px;left:50%;transform:translateX(-50%);z-index:30;background:#2c2c2eed;color:#fff;font-size:12px;padding:12px 18px;border:1px solid #ffffff22;border-radius:20px;white-space:nowrap;pointer-events:none}.finish-counts{display:flex;gap:30px;font-size:12px;color:#8e8e93}.finish-counts span{display:flex;align-items:center;gap:7px}.finish-counts svg{width:17px}.home-pill{height:5px;width:100px;background:currentColor;opacity:.35;margin:0 auto 7px;border-radius:5px;flex:none}@media(max-width:500px){body{background:#000000}#device{height:100dvh;min-height:0;width:100%;margin:0;border-radius:0;box-shadow:none}.status{padding-top:max(8px,env(safe-area-inset-top))}.home-pill{margin-bottom:max(7px,env(safe-area-inset-bottom))}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<body>
<main id="device" class="dark"><div class="status"><span>9:41</span><span>▴▴▴ <svg viewBox="0 0 24 24"><path d="M3 8q9-8 18 0M6 12q6-5 12 0M10 16q2-2 4 0"/></svg><svg viewBox="0 0 24 24"><rect x="3" y="6" width="16" height="12" rx="2"/><path d="M21 10v4M6 9h10v6H6z"/></svg></span></div><div id="app"></div><div class="home-pill"></div><div id="overlay"></div><div id="notices" aria-live="polite"></div></main>
<script>
const paths={help:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M9 8a3 3 0 0 1 6 0c0 2-3 2-3 5m0 4v.1',back:'M15 5l-7 7 7 7',up:'M12 19V5m-6 6 6-6 6 6',down:'M12 5v14m-6-6 6 6 6-6',undo:'M8 5 3 10l5 5M3 10h11a6 6 0 0 1 0 12',trash:'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7',grid:'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',settings:'M4 6h16M4 18h16M8 3v6M16 15v6M4 12h16M14 9v6',close:'m6 6 12 12M18 6 6 18',expand:'M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5',check:'m5 12 4 4L19 6',star:'m12 3 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z',chevron:'m9 5 7 7-7 7',shield:'M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6z',refresh:'M20 8a9 9 0 1 0 1 7M20 3v5h-5'};
const icon=n=>`<svg aria-hidden="true" viewBox="0 0 24 24"><path d="${paths[n]||paths.grid}"/></svg>`;
const data=[['oct','October','mountain'],['sep','September','lake'],['aug','August','sea'],['jul','July','forest'],['jun','June','road'],['may','May','mountain'],['apr','April','coffee']];
const photos=data.flatMap(([m,,cover],j)=>[cover,...['mountain','forest','road','sea','coffee'].filter(x=>x!==cover)].map((asset,i)=>({id:m+i,m,asset,date:`${m[0].toUpperCase()+m.slice(1)} ${24-i*3}`,size:2.4+i*.6})));
let decisions={},deleted=[],history=[],screen='home',month='sep',selected=new Set(),busy=false,full=true,modalOpen=false;
try{const saved=JSON.parse(localStorage.getItem('photo-cleaner-minimal-v2'));if(saved){decisions=saved.decisions||{};deleted=saved.deleted||[]}}catch{}
const app=document.getElementById('app'),overlay=document.getElementById('overlay');
const save=()=>{try{localStorage.setItem('photo-cleaner-minimal-v2',JSON.stringify({decisions,deleted}))}catch{}};
const available=()=>photos.filter(p=>!deleted.includes(p.id));
const pending=m=>available().filter(p=>p.m===m&&!decisions[p.id]);
const list=value=>available().filter(p=>decisions[p.id]===value);
let reviewQueue=[],reviewTotal=0,trashReturn='home';
const reviewPhotos=()=>reviewQueue.map(id=>available().find(p=>p.id===id)).filter(Boolean);
const image=p=>`assets/${p.asset}.jpg`;
function button(action,symbol,label,extra=''){return `<button class="round" data-action="${action}" aria-label="${label}" ${extra}>${icon(symbol)}</button>`}
function tabs(){return `<nav class="tabbar" aria-label="Main navigation">${[['home','grid','Months'],['trash','trash','Remove']].map(([s,i,t])=>`<button data-action="nav" data-screen="${s}" class="${screen===s?'active':''}">${icon(i)}<label>${t}${s==='trash'&&list('trash').length?' · '+list('trash').length:''}</label></button>`).join('')}</nav>`}
function navigate(s){if(busy)return;if(s==='trash'&&screen!=='trash')trashReturn=['review','finish'].includes(screen)?screen:'home';screen=s;selected=new Set();full=true;closeModal();render()}
function openMonth(m){month=m;history=[];const unreviewed=pending(m);reviewQueue=(unreviewed.length?unreviewed:available().filter(p=>p.m===m)).map(p=>p.id);reviewTotal=reviewQueue.length;navigate(reviewTotal?'review':'finish')}
function render(){document.getElementById('device').classList.toggle('dark',screen==='review');if(screen==='review'&&!reviewPhotos().length)screen='finish';
if(screen==='review'){const p=reviewPhotos()[0],total=reviewTotal,done=total-reviewPhotos().length;app.innerHTML=`<header class="bar review-bar">${button('home','back','Back to months')}<div class="center"><h2>${data.find(m=>m[0]===month)[1]} <span style="color:#98989d">2026</span></h2><div class="subtitle">${done+1} / ${total}</div></div>${button('help','help','Gesture guide')}</header><div class="progress"><i style="width:${done/total*100}%"></i></div><section class="photo-stage" aria-label="Swipe photo up to Keep or down to Remove">${reviewPhotos()[1]?`<div class="next-photo original" aria-hidden="true"><img src="${image(reviewPhotos()[1])}" alt="" draggable="false"></div>`:''}<div class="photo ${full?'original':''}" id="photo" role="img" aria-label="${p.asset} photo, ${p.date}. Swipe up to keep or down to mark for removal."><img src="${image(p)}" alt="${p.asset}" draggable="false"><div class="stamp" id="stamp"><span>↑ Keep</span></div></div><button class="direction up" data-action="keep">${icon('up')}Keep</button><button class="direction down" data-action="remove">${icon('down')}Remove</button><span class="photo-meta">${p.date}</span><button class="round fit" data-action="fit" aria-label="${full?'Fill screen':'View entire photo'}" aria-pressed="${full}">${icon('expand')}</button></section><footer class="review-footer">${button('undo','undo','Undo last swipe',history.length?'':'disabled')}<span class="footer-hint">${decisions[p.id]==='keep'?'Kept':decisions[p.id]==='trash'?'Marked to remove':full?'Full photo':'Tap ⛶ for full photo'}</span><button class="queue" data-action="trash" aria-label="Review ${list('trash').length} photos marked for removal">${icon('trash')}<b>${list('trash').length}</b></button></footer>`;bindSwipe();return}
if(screen==='home'){app.innerHTML=`<header class="bar"><h1>Photo Cleaner</h1>${button('settings','settings','Settings')}</header><div class="scroll"><div class="months">${data.map(([m,name,asset],index)=>{let total=photos.filter(p=>p.m===m).length,done=total-pending(m).length;return `<button class="month${index===0?' current':''}" data-action="month" data-month="${m}"><img src="assets/${asset}.jpg" alt="">${index===0?'<span class="current-label">This month · 2026</span>':''}<div class="month-info"><b>${name}</b><small>${done===total?'✓ Completed':done?`${done} / ${total} sorted`:`${total} photos`}</small><div class="line"><i style="width:${done/total*100}%"></i></div></div></button>`}).join('')}</div></div>${tabs()}`;return}
if(screen==='trash'){let items=list('trash');selected=new Set([...selected].filter(id=>items.some(p=>p.id===id)));app.innerHTML=`<header class="bar">${button('back-trash','back',trashReturn==='review'?'Back to sorting':trashReturn==='finish'?'Back to summary':'Back to months')}<h2>To remove</h2><div style="width:44px"></div></header><div class="collection-header"><span>${items.length} photo${items.length===1?'':'s'}</span>${items.length?`<button class="text-btn" data-action="select-all">${selected.size===items.length?'Deselect all':'Select all'}</button>`:''}</div>${items.length?`<div class="scroll"><div class="collection">${items.map(p=>`<button class="tile ${selected.has(p.id)?'selected':''}" data-action="select" data-id="${p.id}" aria-label="Select ${p.asset} photo" aria-pressed="${selected.has(p.id)}"><img src="${image(p)}" alt="${p.asset}"><span class="tick">${selected.has(p.id)?icon('check'):''}</span></button>`).join('')}</div></div>`:`<div class="empty"><div class="orb">${icon('trash')}</div><h2>Nothing to remove</h2><p>Photos you swipe down appear here.</p>${trashReturn==='review'?'':'<button class="solid" data-action="resume">Browse photos</button>'}</div>`}${items.length?`<div class="bottom-actions"><button class="solid secondary" data-action="restore" ${selected.size?'':'disabled'}>Keep selected</button><button class="solid danger" data-action="confirm" ${selected.size?'':'disabled'}>Delete${selected.size?' · '+selected.size:''}</button></div>`:''}${tabs()}`;return}
if(screen==='finish'){document.getElementById('device').classList.remove('dark');let items=photos.filter(p=>p.m===month);app.innerHTML=`<header class="bar">${button('home','back','Back to months')}<h2>${data.find(m=>m[0]===month)[1]}</h2><div style="width:44px"></div></header><div class="empty"><img class="finish-image" src="${image(items[0])}" alt="Month cover"><h2>${available().some(p=>p.m===month)?"Month, sorted.":"No photos left."}</h2><div class="finish-counts"><span>${icon('check')}${items.filter(p=>decisions[p.id]==='keep').length} kept</span><span>${icon('trash')}${items.filter(p=>decisions[p.id]==='trash'&&!deleted.includes(p.id)).length} to remove</span></div><button class="solid" data-action="${list('trash').length?'trash':'next'}">${list('trash').length?'Review removals':'Next month'}</button><button class="text-btn" data-action="browse-again" ${available().some(p=>p.m===month)?'':'disabled'}>Browse again</button><button class="text-btn" data-action="undo" ${history.length?'':'disabled'}>Undo last swipe</button></div>${tabs()}`;return}
if(screen==='settings'){app.innerHTML=`<header class="bar">${button('home','back','Back to months')}<h2>Settings</h2><div style="width:44px"></div></header><div class="settings"><button class="setting" data-action="help"><span>${icon('up')}Swipe guide</span>${icon('chevron')}</button><button class="setting" data-action="rate"><span>${icon('star')}Rate Photo Cleaner</span>${icon('chevron')}</button><button class="setting" data-action="privacy"><span>${icon('shield')}Privacy</span>${icon('chevron')}</button><button class="setting" data-action="reset"><span>${icon('refresh')}Reset demo</span>${icon('chevron')}</button><p class="demo">Interactive concept · Sample photos only</p></div>`}}
function decide(value,fromSwipe=false){if(busy||screen!=='review')return;const p=reviewPhotos()[0];if(!p)return;busy=true;const duration=fromSwipe?230:560;const easing=fromSwipe?'ease':'cubic-bezier(.42,0,.58,1)';const next=document.querySelector('.next-photo');if(next){next.style.transition=`transform ${duration}ms ${easing}`;next.style.transform='scale(1)'}const el=document.getElementById('photo');el.style.transition=`transform ${duration}ms ${easing},opacity ${fromSwipe?duration:140}ms ease ${fromSwipe?0:duration-140}ms`;el.style.transform=`translateY(${value==='keep'?'-':'+'}110%) rotate(${value==='keep'?-5:5}deg)`;el.style.opacity='0';setTimeout(()=>{history.push({id:p.id,previous:decisions[p.id]});decisions[p.id]=value;reviewQueue=reviewQueue.filter(id=>id!==p.id);save();busy=false;full=true;render()},duration)}
function undo(){if(busy||!history.length)return;const item=history.pop();if(item.previous)decisions[item.id]=item.previous;else delete decisions[item.id];reviewQueue.unshift(item.id);save();screen='review';render()}
function bindSwipe(){const el=document.getElementById('photo');let start=null;el.onpointerdown=e=>{if(busy)return;start={x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId);el.style.transition='none';const next=document.querySelector('.next-photo');if(next)next.style.transition='none'};el.onpointermove=e=>{if(!start||busy)return;let dy=e.clientY-start.y,keep=dy<0;const next=document.querySelector('.next-photo');if(next){const distance=Math.max(120,el.clientHeight*.42);const progress=Math.min(Math.abs(dy)/distance,1);next.style.transform=`scale(${.85+.15*progress})`}el.style.transform=`translate(${(e.clientX-start.x)*.12}px,${dy}px) rotate(${dy/80}deg)`;let stamp=document.getElementById('stamp');stamp.classList.toggle('remove',!keep);stamp.innerHTML=`<span>${keep?'↑ Keep':'↓ Remove'}</span>`;stamp.style.opacity=Math.min(Math.abs(dy)/100,1)};const end=(e,cancel=false)=>{if(!start)return;const dy=e.clientY-start.y,dx=e.clientX-start.x;start=null;if(!cancel&&Math.abs(dy)>80&&Math.abs(dy)>Math.abs(dx)*1.2)decide(dy<0?'keep':'trash',true);else{el.style.transition='transform .2s';el.style.transform='';const next=document.querySelector('.next-photo');if(next){next.style.transition='transform .2s';next.style.transform='scale(.85)'}document.getElementById('stamp').style.opacity=0}};el.onpointerup=e=>end(e);el.onpointercancel=e=>end(e,true)}
function toast(msg){document.getElementById('notices').innerHTML=`<div class="toast">${msg}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('notices').innerHTML='',2000)}
let previousFocus;
function sheet(title,copy,actions){previousFocus=document.activeElement;modalOpen=true;overlay.innerHTML=`<div class="overlay"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="handle"></div><h2>${title}</h2><p>${copy}</p>${actions}</section></div>`;overlay.querySelector('button')?.focus()}
function closeModal(){modalOpen=false;overlay.innerHTML='';if(previousFocus?.isConnected)previousFocus.focus()}
function preview(id){const p=photos.find(p=>p.id===id);previousFocus=document.activeElement;modalOpen=true;overlay.innerHTML=`<div class="preview" role="dialog" aria-modal="true" aria-label="Full photo"><img src="${image(p)}" alt="${p.asset}">${button('dismiss','close','Close preview')}</div>`;overlay.querySelector('button').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled||busy)return;const a=b.dataset.action;if(a==='nav')navigate(b.dataset.screen);else if(['home','trash','settings'].includes(a))navigate(a);else if(a==='back-trash')navigate(trashReturn);else if(a==='month')openMonth(b.dataset.month);else if(a==='keep')decide('keep');else if(a==='remove')decide('trash');else if(a==='browse-again')openMonth(month);else if(a==='undo')undo();else if(a==='fit'){full=!full;render()}else if(a==='resume')openMonth(pending(month).length?month:data.find(m=>pending(m[0]).length)?.[0]||month);else if(a==='next'){let m=data.find(m=>pending(m[0]).length);m?openMonth(m[0]):navigate('home')}else if(a==='select'){selected.has(b.dataset.id)?selected.delete(b.dataset.id):selected.add(b.dataset.id);render()}else if(a==='select-all'){selected=selected.size===list('trash').length?new Set():new Set(list('trash').map(p=>p.id));render()}else if(a==='restore'){for(const id of selected)decisions[id]='keep';selected.clear();history=[];save();render();toast('Photos kept')}else if(a==='preview')preview(b.dataset.id);else if(a==='dismiss')closeModal();else if(a==='help')sheet('One photo. One swipe.','↑ &nbsp; Keep — leave it in its month.<br>↓ &nbsp; Remove — review before deleting.<br><br>Tap ↶ to undo.',`<button class="solid" data-action="dismiss">Got it</button>`);else if(a==='confirm')sheet(`Delete ${selected.size} photo${selected.size===1?'':'s'}?`,'Permanent deletion. Review your selection first.<br><br>Demo only — your real photos are untouched.',`<button class="solid danger" data-action="delete">Delete photos</button><button class="solid secondary" data-action="dismiss">Cancel</button>`);else if(a==='delete'){let count=selected.size;deleted.push(...selected);selected.clear();history=[];save();closeModal();render();toast(`${count} sample photo${count===1?'':'s'} deleted`)}else if(a==='rate')toast('Demo: opens Google Play reviews');else if(a==='privacy')sheet('Your photos stay yours.','Keeping a photo leaves it in its original month. Reopen any month to review it again.<br><br>This demo uses sample photos and never accesses your library.',`<button class="solid" data-action="dismiss">Done</button>`);else if(a==='reset')sheet('Start fresh?','Reset sorting for these sample photos.',`<button class="solid" data-action="reset-confirmed">Reset demo</button><button class="solid secondary" data-action="dismiss">Cancel</button>`);else if(a==='reset-confirmed'){decisions={};deleted=[];history=[];save();month='sep';navigate('home')}});
document.addEventListener('keydown',e=>{if(modalOpen){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const els=[...overlay.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}return}if(e.target.closest('button'))return;if(screen==='review'&&['ArrowUp','ArrowDown','z'].includes(e.key)){e.preventDefault();e.key==='z'?undo():decide(e.key==='ArrowUp'?'keep':'trash')}});
render();
</script>
</body></html>
