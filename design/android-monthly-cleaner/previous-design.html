const img=(p)=>photoAssets[p];
const monthPhotos=id=>photos.filter(p=>p.month===id&&!state.deleted.includes(p.id));
const pending=id=>monthPhotos(id).filter(p=>!state.decisions[p.id]);
const trash=()=>photos.filter(p=>state.decisions[p.id]==='trash'&&!state.deleted.includes(p.id));
const progress=id=>{const all=photos.filter(p=>p.month===id);return{total:all.length,done:all.filter(p=>state.decisions[p.id]||state.deleted.includes(p.id)).length}};
const mb=arr=>arr.reduce((s,p)=>s+p.size,0).toFixed(1);
const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify(state))}catch{}};
function nav(target){screen=target;busy=false;modal='';document.getElementById('overlay').innerHTML='';if(target==='trash')selected=new Set(trash().map(p=>p.id));render();}
function openMonth(id){activeMonth=id;history=[];finishDemo=false;nav(pending(id).length?'review':'finish');}
function bottom(current){return `<nav class="bottom-nav" aria-label="Main navigation"><button data-act="nav-home" class="${current==='home'?'on':''}"><span class="nav-icon">${icon('grid')}</span>Months</button><button data-act="nav-trash" class="${current==='trash'?'on':''}"><span class="nav-icon">${icon('trash')}${trash().length?`<b class="badge">${trash().length}</b>`:''}</span>To delete</button></nav><div class="gesture-bar"></div>`;}
function renderHome(){const resume=months.find(m=>{let p=progress(m.id);return p.done>0&&p.done<p.total})||months.find(m=>pending(m.id).length)||months[0];const pr=progress(resume.id);const total=photos.filter(p=>state.decisions[p.id]||state.deleted.includes(p.id)).length;let shown=months.filter(m=>filter==='all'||(filter==='done'?pending(m.id).length===0:pending(m.id).length>0));return `<div class="scroll"><header class="header"><div class="wordmark">${icon('leaf')}Photo Cleaner</div><button class="icon-btn plain" data-act="settings" aria-label="Settings">${icon('settings')}</button></header><div class="hero-title"><h2>Make room for<br>what matters.</h2><p><b>${total}</b> photos reviewed. Every little bit counts.</p></div><button class="continue-card" data-act="month" data-id="${resume.id}"><img src="${img(resume.cover)}" alt="A quiet lake in the mountains"><div class="continue-content"><div class="continue-top">${icon('clock')} ${pr.done?'PICK UP WHERE YOU LEFT OFF':'START WITH THIS MONTH'}</div><h3>${resume.name}<span>2026</span></h3><div class="continue-bottom"><div>${pr.done} of ${pr.total} reviewed<div class="mini-progress"><i style="width:${pr.done/pr.total*100}%"></i></div></div><span class="round-arrow">${icon('arrow')}</span></div></div></button><div class="section-header"><h3>Your months</h3><span>2026 · ${months.length} months</span></div><div class="chips">${[['all','All'],['todo','To review'],['done','Completed']].map(([id,label])=>`<button class="chip ${filter===id?'on':''}" data-act="filter" data-id="${id}">${label}</button>`).join('')}</div>${shown.length?`<div class="month-grid">${shown.map(m=>{let p=progress(m.id);return `<button class="month" data-act="month" data-id="${m.id}" aria-label="Review ${m.name}"><div class="month-cover"><img src="${img(m.cover)}" alt="${m.name} photo cover" loading="lazy"><span class="month-num">${m.name.slice(0,3)}</span>${p.done?`<span class="month-badge">${p.done===p.total?'✓ Done':'In progress'}</span>`:''}</div><div class="month-meta"><span>${photoCount(p.total)}</span><small>${p.done?`${Math.round(p.done/p.total*100)}%`:'Not started'}</small></div><div class="month-line"><i style="width:${p.done/p.total*100}%"></i></div></button>`}).join('')}</div>`:`<div class="empty" style="padding-top:20px">${icon('leaf')}<h3>Start with one month</h3><p>Completed months will appear here.</p></div>`}<div class="home-bottom">${icon('shield')}Your photos stay on your device</div></div>${bottom('home')}`}
function renderReview(){const p=pending(activeMonth)[0];if(!p){screen='finish';return renderFinish()}let pr=progress(activeMonth);let marked=trash().filter(x=>x.month===activeMonth);return `<header class="review-head"><button class="icon-btn plain" data-act="nav-home" aria-label="Back to months">${icon('back')}</button><div class="title"><h2>${monthName(activeMonth)}</h2><p>2026 · One photo at a time</p></div><button class="icon-btn plain" data-act="help" aria-label="How to swipe">${icon('leaf')}</button></header><div class="review-progress"><div class="progress-label"><span><b>${pr.done+1}</b> of ${pr.total}</span><span>${Math.round(pr.done/pr.total*100)}% reviewed</span></div><div class="progress-track"><i style="width:${pr.done/pr.total*100}%"></i></div></div><div class="deck"><article class="photo-card" id="photo-card" aria-label="Swipe left to mark for deletion, right to keep"><img src="${img(p.img)}" alt="${labels[p.img]}" draggable="false"><div class="photo-top"><span class="photo-tag">${p.size.toFixed(1)} MB · Photo</span><button data-act="favorite" data-id="${p.id}" aria-label="${state.favorites.includes(p.id)?'Remove favorite':'Favorite photo'}" aria-pressed="${state.favorites.includes(p.id)}" style="${state.favorites.includes(p.id)?'color:#ffdcaa':''}">${icon('heart')}</button></div><div class="stamp keep">Keep</div><div class="stamp remove">Remove</div><div class="photo-caption"><div><h3>${photoDate(p)} · ${photoTime(p)}</h3><p>${labels[p.img]}</p></div><button data-act="preview" data-id="${p.id}" aria-label="Enlarge photo" style="color:white;padding:8px">${icon('expand')}</button></div></article></div><div class="swipe-hint"><span>${icon('back')}Swipe left to remove</span><span>Swipe right to keep${icon('arrow')}</span></div><div class="actions"><div class="action-group small"><button data-act="undo" aria-label="Undo last action" ${history.length?'':'disabled'}>${icon('undo')}</button><span>Undo</span></div><div class="action-group"><button class="action-delete" data-act="decide-trash" aria-label="Mark for deletion">${icon('trash')}</button><span>Remove</span></div><div class="action-group"><button class="action-keep" data-act="decide-keep" aria-label="Keep photo">${icon('check')}</button><span>Keep</span></div><div class="action-group small"><button data-act="preview" data-id="${p.id}" aria-label="View full photo">${icon('expand')}</button><span>Enlarge</span></div></div><button class="review-tray" data-act="nav-trash">${icon('trash')}<span>${marked.length} to delete <small>· Review before deleting</small></span><span class="right">${icon('arrow')}</span></button><div class="gesture-bar"></div>`}
function renderTrash(){const list=trash();selected=new Set([...selected].filter(id=>list.some(p=>p.id===id)));const picked=list.filter(p=>selected.has(p.id));return `<header class="header"><button class="icon-btn plain" data-act="${pending(activeMonth).length?'back-review':'nav-home'}" aria-label="Back">${icon('back')}</button><span class="eyebrow">KEEP WHAT MATTERS</span><button class="icon-btn plain" data-act="help-trash" aria-label="About deletion">${icon('shield')}</button></header><div class="trash-heading"><h2>One last look.</h2><p>${list.length?`${photoCount(list.length)} to review. You can still change your mind.`:'No photos marked for deletion yet.'}</p></div>${list.length?`<div class="selection-bar"><button data-act="select-all">${selected.size===list.length?'Deselect all':'Select all'} · ${selected.size}/${list.length}</button><button data-act="restore" ${selected.size?'':'disabled'}>Keep selected</button></div><div class="scroll"><div class="trash-grid">${list.map(p=>`<div class="trash-item"><img src="${img(p.img)}" alt="${labels[p.img]}"><button class="select-photo" data-act="toggle-selection" data-id="${p.id}" aria-label="${selected.has(p.id)?'Deselect':'Select'} photo from ${photoDate(p)}" aria-pressed="${selected.has(p.id)}"><span class="check-circle ${selected.has(p.id)?'checked':''}">${selected.has(p.id)?icon('check'):''}</span></button><span class="trash-caption">${photoDate(p)} · ${p.size.toFixed(1)} MB</span><button class="trash-preview" data-act="preview" data-id="${p.id}" aria-label="Preview photo">${icon('expand')}</button></div>`).join('')}</div></div><footer class="trash-footer"><div class="trash-summary"><span>Space to free up<b>${mb(picked)} <small>MB</small></b></span><span>${picked.length} selected</span></div><button class="primary danger" data-act="confirm-delete" ${picked.length?'':'disabled'}>${icon('trash')}Delete ${photoCount(picked.length)}</button></footer>`:`<div class="scroll"><div class="empty">${icon('leaf')}<h3>All clear for now.</h3><p>Photos you swipe left on appear here.<br>You always get the final say.</p><button class="primary" data-act="nav-home">Choose a month${icon('arrow')}</button></div></div>`}${bottom('trash')}`}
function renderFinish(){const m=months.find(m=>m.id===activeMonth);const all=photos.filter(p=>p.month===activeMonth);const kept=all.filter(p=>state.decisions[p.id]==='keep').length;const marked=trash().filter(p=>p.month===activeMonth).length;const pr=progress(activeMonth);return `<header class="review-head"><button class="icon-btn plain" data-act="nav-home" aria-label="Back to months">${icon('back')}</button><span class="eyebrow">${finishDemo?'COMPLETION PREVIEW':'ONE MONTH, A LITTLE LIGHTER'}</span><span style="width:40px"></span></header><div class="complete"><div class="complete-art"><img src="${img(m.cover)}" alt="Memories from this month"><img src="${img('forest')}" alt="A photo worth keeping"><span class="complete-check">${icon('check')}</span></div><h2>${m.name},<br>${pr.done===pr.total||finishDemo?'all sorted.':'a little lighter.'}</h2><p>Keep the memories. Lose the clutter.<br>${finishDemo?'A preview of your end-of-month moment.':`You have reviewed ${photoCount(pr.done)}.`}</p><div class="complete-stats"><div><b>${finishDemo?9:kept}</b>kept</div><div><b>${finishDemo?3:marked}</b>to delete</div></div><button class="primary" data-act="${marked?'nav-trash':'next-month'}">${marked?`Review ${photoCount(marked)}`:'Try another month'}${icon('arrow')}</button><button class="secondary" data-act="nav-home">Done for today</button></div><div class="gesture-bar"></div>`}
function renderDeleted(){return `<header class="review-head"><button class="icon-btn plain" data-act="nav-home" aria-label="Back to months">${icon('back')}</button><span class="eyebrow">A LITTLE MORE SPACE</span><span style="width:40px"></span></header><div class="complete"><div class="complete-art"><img src="${img('sea')}" alt="An open sea"><img src="${img('lake')}" alt="A peaceful lake"><span class="complete-check">${icon('check')}</span></div><h2>A little less clutter.<br>A little more space.</h2><p>Cleanup complete.<br>More room for your next memory.</p><div class="complete-stats"><div><b>${lastDeleted.count}</b>demo photos deleted</div><div><b>${lastDeleted.size}</b>MB freed in this demo</div></div><button class="primary" data-act="nav-home">Back to my months${icon('arrow')}</button>${trash().length?`<button class="secondary" data-act="nav-trash">Review ${photoCount(trash().length)} remaining</button>`:''}</div><div class="gesture-bar"></div>`}
function render(){app.innerHTML=screen==='home'?renderHome():screen==='review'?renderReview():screen==='trash'?renderTrash():screen==='deleted'?renderDeleted():renderFinish();if(screen==='review')bindSwipe();}
function toast(message){document.getElementById('toast').innerHTML=`<div class="toast">${message}</div>`;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',2400)}
function decide(value){if(screen!=='review'||busy||modal)return;const p=pending(activeMonth)[0];if(!p)return;busy=true;const card=document.getElementById('photo-card');card.style.transition='transform .22s ease, opacity .22s';card.style.transform=`translateX(${value==='keep'?440:-440}px) rotate(${value==='keep'?20:-20}deg)`;card.style.opacity='0';setTimeout(()=>{history.push({id:p.id,previous:state.decisions[p.id]});state.decisions[p.id]=value;save();busy=false;if(!pending(activeMonth).length)screen='finish';render()},220)}
function undo(){if(busy||!history.length)return;let item=history.pop();if(item.previous)state.decisions[item.id]=item.previous;else delete state.decisions[item.id];save();screen='review';render();toast('Last action undone')}
function sheet(content){modal='sheet';document.getElementById('overlay').innerHTML=`<div class="modal-shade" data-act="dismiss-shade"><section class="sheet" role="dialog" aria-modal="true" aria-label="Confirm action"><div class="handle"></div>${content}</section></div>`;document.querySelector('.sheet button')?.focus()}
function closeModal(){modal='';document.getElementById('overlay').innerHTML=''}
function preview(id){let p=photos.find(p=>p.id===id);if(!p)return;modal='preview';document.getElementById('overlay').innerHTML=`<div class="fullscreen-photo" role="dialog" aria-modal="true" aria-label="Full photo"><button class="icon-btn" data-act="close-modal" aria-label="Close preview">${icon('close')}</button><img src="${img(p.img)}" alt="${labels[p.img]}"><p>${photoDate(p, true)} · ${p.size.toFixed(1)} MB</p></div>`;document.querySelector('.fullscreen-photo button').focus()}
function settings(){sheet(`<h2>At your own pace.</h2><p>A little photo cleanup, at your own pace.</p><div class="setting-row"><div>Monthly reminder<small>First of each month, at 8 PM</small></div><button class="switch ${state.reminder?'enabled':''}" data-act="toggle-reminder" role="switch" aria-checked="${state.reminder}" aria-label="Monthly reminder"><i></i></button></div><div class="setting-row"><div>Photos stay on your device<small>No account needed</small></div>${icon('shield')}</div><button class="setting-row rating-row" data-act="rate-app"><span class="rating-icon">${icon('star')}</span><span>Rate Photo Cleaner<small>Share your feedback on Google Play</small></span><span class="rating-arrow">${icon('arrow')}</span></button><p style="margin-top:20px;font-size:10px">This prototype uses sample photos and does not access your library. The reminder is a preview only; no notifications are sent.</p><button class="primary" data-act="close-modal">Got it</button><button class="secondary" data-act="reset">Reset demo</button>`)}
function bindSwipe(){let card=document.getElementById('photo-card'),start=null;card.addEventListener('pointerdown',e=>{if(e.target.closest('button')||busy)return;start={x:e.clientX,y:e.clientY,id:e.pointerId};card.setPointerCapture(e.pointerId);card.style.transition='none'});card.addEventListener('pointermove',e=>{if(!start)return;let dx=e.clientX-start.x;card.style.transform=`translate(${dx}px,${(e.clientY-start.y)*.15}px) rotate(${dx/20}deg)`;card.querySelector('.keep').style.opacity=dx>0?Math.min(dx/100,1):0;card.querySelector('.remove').style.opacity=dx<0?Math.min(-dx/100,1):0});const end=(e,cancel=false)=>{if(!start)return;let dx=e.clientX-start.x;start=null;if(!cancel&&Math.abs(dx)>75)decide(dx>0?'keep':'trash');else{card.style.transition='transform .2s';card.style.transform='';card.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0)}};card.addEventListener('pointerup',e=>end(e));card.addEventListener('pointercancel',e=>end(e,true));}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled||busy)return;let a=b.dataset.act,id=b.dataset.id;
if(a==='dismiss-shade'){if(e.target===b)closeModal();return}
if(a==='nav-home')nav('home');else if(a==='nav-review'){openMonth(pending(activeMonth).length?activeMonth:months.find(m=>pending(m.id).length)?.id||activeMonth)}else if(a==='back-review')nav('review');else if(a==='nav-trash')nav('trash');else if(a==='nav-finish'){finishDemo=true;nav('finish')}else if(a==='month')openMonth(id);else if(a==='filter'){filter=id;render()}else if(a==='decide-keep')decide('keep');else if(a==='decide-trash')decide('trash');else if(a==='undo')undo();else if(a==='favorite'){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render()}else if(a==='preview')preview(id);else if(a==='close-modal')closeModal();else if(a==='settings')settings();else if(a==='rate-app')toast('Demo: this would open Google Play reviews.');else if(a==='toggle-reminder'){state.reminder=!state.reminder;save();settings()}else if(a==='toggle-selection'){selected.has(id)?selected.delete(id):selected.add(id);render()}else if(a==='select-all'){selected=selected.size===trash().length?new Set():new Set(trash().map(p=>p.id));render()}else if(a==='restore'){const count=selected.size;for(let id of selected)state.decisions[id]='keep';selected.clear();save();render();toast(`${photoCount(count)} kept`)}else if(a==='confirm-delete'){const list=trash().filter(p=>selected.has(p.id));sheet(`<div class="sheet-icon">${icon('trash')}</div><h2>Delete ${photoCount(list.length)}?</h2><p>Free up about ${mb(list)} MB.<br>You can go back if you want another look.</p><p style="font-size:10px;background:#edf0e6;border-radius:10px;padding:10px 12px">Demo only. Your real photos will not be deleted. The Android app would request system approval here.</p><button class="primary danger" data-act="delete-confirmed">Delete ${photoCount(list.length)}</button><button class="secondary" data-act="close-modal">Go back</button>`)}else if(a==='delete-confirmed'){const list=trash().filter(p=>selected.has(p.id));lastDeleted={count:list.length,size:mb(list)};state.deleted.push(...list.map(p=>p.id));selected.clear();save();closeModal();nav('deleted')}else if(a==='next-month'){const next=months.find(m=>pending(m.id).length);if(next)openMonth(next.id);else nav('home')}else if(a==='help'){sheet(`<h2>A simple swipe.</h2><p>Swipe left to mark a photo for deletion.<br>Swipe right to keep it.<br>Tap Undo to go back one photo.<br><br>Your progress is saved automatically. Nothing is deleted until you review and confirm.</p><button class="primary" data-act="close-modal">Start sorting</button>`)}else if(a==='help-trash'){sheet(`<h2>Take one last look.</h2><p>Tap a photo to select or deselect it.<br>Tap Keep selected to remove photos from this list.<br><br>Only selected photos are included when you confirm deletion.</p><button class="primary" data-act="close-modal">Got it</button>`)}else if(a==='reset'){sheet(`<h2>Start fresh?</h2><p>This resets review progress, favorites, and deleted sample photos in this prototype.</p><button class="primary" data-act="reset-confirmed">Reset demo</button><button class="secondary" data-act="close-modal">Cancel</button>`)}else if(a==='reset-confirmed'){state=initial();save();history=[];filter='all';activeMonth='09';closeModal();nav('home');toast('Demo reset')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)closeModal();else if(screen!=='home')nav('home');return}if(modal){if(e.key==='Tab'){let els=[...document.querySelectorAll('#overlay button:not(:disabled)')];if(!els.length)return;if(e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}return}if(screen==='review'&&!busy){if(e.key==='ArrowLeft'){e.preventDefault();decide('trash')}else if(e.key==='ArrowRight'){e.preventDefault();decide('keep')}else if(e.key.toLowerCase()==='z')undo()}});
render();
</script>
</body>
</html>
